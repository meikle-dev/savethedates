<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>SaveTheDates launch film</title>
<style>
@font-face{font-family:"Cormorant";src:url(assets/cormorant-garamond-latin-regular.woff2) format("woff2");font-style:normal;font-weight:300 700}
@font-face{font-family:"Cormorant";src:url(assets/cormorant-garamond-latin-italic.woff2) format("woff2");font-style:italic;font-weight:300 700}
:root{--navy:#0B2A3D;--teal:#0F4C5C;--sage:#2F6B4F;--paper:#F8F6F0;--blue:#EAF2F6;--ink:#10283A;--cream:#F4F0E6;--mist:#D8E0DA}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--navy)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--navy);font-family:Arial,Helvetica,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0;visibility:hidden}
.abs{position:absolute}
.serif{font-family:Georgia,"Times New Roman",serif;font-weight:400}
.corm{font-family:"Cormorant",Georgia,serif}
.eyebrow{font:700 17px/1 Arial,sans-serif;letter-spacing:.34em;text-transform:uppercase;white-space:nowrap}
.mask{overflow:hidden;display:inline-block;vertical-align:top}
.center{transform-origin:50% 50%}
.ln-mask{padding:0 .1em .2em;margin:0 -.1em -.2em}

/* phone */
.phone{position:absolute;left:0;top:0;width:418px;height:918px;border-radius:68px;
  background:linear-gradient(150deg,#3a4852 0%,#141d24 22%,#0c1318 60%,#27343d 100%);
  box-shadow:inset 0 0 0 1.5px #6b7b86,inset 0 0 0 5px #10181e,0 60px 120px -30px rgba(0,0,0,.6),0 24px 50px -16px rgba(0,0,0,.45)}
.phone .screen{position:absolute;left:14px;top:14px;width:390px;height:890px;border-radius:54px;overflow:hidden;background:#fff;isolation:isolate}
.phone .island{position:absolute;left:50%;top:27px;width:116px;height:33px;margin-left:-58px;border-radius:20px;background:#04070a;z-index:5}
.phone .glare{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 70%,rgba(255,255,255,.05) 100%);pointer-events:none;z-index:4}
.phone .side{position:absolute;width:4px;border-radius:2px;background:#2a353d}
.layer{position:absolute;inset:0;overflow:hidden}
.status{position:absolute;left:0;top:0;width:390px;height:46px;display:flex;justify-content:space-between;align-items:center;padding:4px 36px 0 44px;font:700 16px/1 -apple-system,"Segoe UI",Arial,sans-serif;color:#15191c;z-index:2}
.status.dark{color:#f3efe6}
.status svg{display:block}
.shot{position:absolute;left:0;top:46px;width:390px;height:844px;overflow:hidden}
.shot img{position:absolute;left:0;top:0;width:390px;display:block}

/* grid wall */
.mini{position:absolute;width:210px;height:458px;border-radius:34px;background:#0e161c;box-shadow:inset 0 0 0 1.5px #56646e,0 30px 60px -20px rgba(0,0,0,.6);padding:7px}
.mini .in{width:100%;height:100%;border-radius:28px;overflow:hidden;position:relative}
.mini .in i{position:absolute;left:0;top:0;right:0;height:22px}
.mini img{position:absolute;left:0;top:22px;width:196px}

/* cards (platform UI) */
.card{position:absolute;background:#FDFCF8;border:1.5px solid #DEDBD1;border-radius:24px;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:14px;height:62px;padding:0 28px;border-radius:14px;font:700 22px/1 Arial,sans-serif;white-space:nowrap}
.btn.dark{background:#16252F;color:#fff}
.btn.line{border:1.5px solid #D5D3CB;color:#10283A;background:#FDFCF8}

/* RSVP page */
.rp{position:absolute;left:0;top:0;width:390px;background:#EEEDE3;color:#23261f}
.rp .hdr{height:107px;background:#F5F1E8;border-bottom:1px solid #d9d6cc;text-align:center}
.rp .hdr .nm{padding-top:22px;font:400 18px/1 "Cormorant";letter-spacing:.24em}
.rp .hdr .nav{margin-top:22px;display:flex;justify-content:center;gap:24px;font:400 9.5px/1 Arial;letter-spacing:.16em}
.rp .hdr .nav b{font-weight:400;border-bottom:1.2px solid #23261f;padding-bottom:5px}
.rp .hero{text-align:center;padding:26px 0 0}
.rp .hero img{width:60px;display:block;margin:0 auto}
.rp .ey{font:400 10.5px/1 Arial;letter-spacing:.32em;color:#56604b;margin-top:22px}
.rp .big{font:400 66px/1 "Cormorant";letter-spacing:.09em;margin-top:14px}
.rp .by{font:400 22px/1.2 "Cormorant";margin-top:14px}
.rp .fine{font:400 12.5px/1.45 Arial;color:#2b2e28;margin:14px 22px 0}
.rp .frame{margin:22px 11px 0;border:1.2px solid #b9bcaa;padding:6px;background:#E9E8DD}
.rp .form{background:#FFFDF7;border:1px solid #c9cbbb;padding:26px 22px 30px}
.rp h4{font:400 21px/1.1 "Cormorant";margin:0 0 12px}
.rp .inp{height:52px;border:1.2px solid #d3d3c9;border-radius:3px;background:#FFFEFA;font:400 17px/52px Arial;padding:0 16px;color:#1d201a;position:relative}
.rp .caret{display:inline-block;width:1.5px;height:22px;background:#1d201a;vertical-align:-5px;margin-left:1px}
.rp .help{font:400 12.5px/1.45 Arial;color:#5c6057;margin:10px 0 26px}
.rp .opt{position:relative;display:flex;align-items:center;gap:16px;min-height:52px;border:1.2px solid #d6d6cc;background:#FFFEFA;padding:12px 18px;margin-bottom:11px;font:400 15.5px/1.3 Arial;color:#1d201a}
.rp .opt.c{font:400 21px/1.1 "Cormorant";min-height:57px}
.rp .opt .sel{position:absolute;inset:-1.2px;border:2px solid #4F5B41;background:#E5E6D8;opacity:0}
.rp .opt span{position:relative}
.rp .rad{position:relative;flex:0 0 22px;width:22px;height:22px;border-radius:50%;border:1.5px solid #6d7169;background:#fff}
.rp .rad i{position:absolute;left:4px;top:4px;width:11px;height:11px;border-radius:50%;background:#4F5B41;transform:scale(0)}
.rp .chk{position:relative;flex:0 0 22px;width:22px;height:22px;border-radius:3px;border:1.5px solid #6d7169;background:#fff}
.rp .chk i{position:absolute;inset:-1.5px;border-radius:3px;background:#2E3326;transform:scale(0)}
.rp .chk svg{position:absolute;left:2px;top:2px}
.rp hr{border:0;border-top:1px solid #dcdcd2;margin:20px 0 22px}
.rp .send{height:60px;background:#526044;color:#F5F1E8;display:flex;align-items:center;justify-content:center;gap:18px;font:400 23px/1 "Cormorant";margin-top:26px;position:relative}
.tap{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(40,46,34,.18);border:2px solid rgba(40,46,34,.35);opacity:0;pointer-events:none;z-index:9}

/* overlays */
#grain{position:absolute;left:0;top:0;width:1920px;height:1080px;mix-blend-mode:overlay;opacity:.09;pointer-events:none;z-index:50}
#vig{position:absolute;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.28) 100%)}
#caption{position:absolute;left:44px;bottom:36px;z-index:48;font:700 12px/1 Arial;letter-spacing:.24em;text-transform:uppercase;color:#fff;mix-blend-mode:difference;opacity:0}
</style>
</head>
<body>
<div id="stage"></div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="node_modules/gsap/dist/SplitText.min.js"></script>
<script src="node_modules/gsap/dist/CustomEase.min.js"></script>
<script>
"use strict";
gsap.registerPlugin(SplitText, CustomEase);
gsap.config({ force3D: true });
CustomEase.create("silk", "M0,0 C0.16,0.84 0.3,1 1,1");
CustomEase.create("swoop", "M0,0 C0.76,0 0.14,1 1,1");
CustomEase.create("snap", "M0,0 C0.5,0 0.08,1 1,1");
(async () => {
await Promise.all([document.fonts.load("400 40px Cormorant"), document.fonts.load("italic 400 40px Cormorant")]);

// All times below are composition seconds. SPEED sets playback: 0.8 plays the film 20% slower (59.4 s).
const SPEED = 0.8;
const BEAT = 0.625, BAR = 2.5, DURATION = 47.5;
const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
const cues = [];
const cue = (type, t, extra = {}) => cues.push({ type, t: +t.toFixed(4), ...extra });
const updaters = [];
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function el(tag, cls, html, parent, style) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  if (style) e.style.cssText = style;
  if (parent) parent.appendChild(e);
  return e;
}
const stage = $("#stage");
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (name) => gsap.parseEase(name);
function prog(t, t0, t1, e = "none") { return ease(e)(clamp((t - t0) / (t1 - t0))); }
function scene(id, t0, t1, bg) {
  const s = el("div", "scene", null, stage);
  s.id = id;
  if (bg) s.style.background = bg;
  if (t0 <= 0) s.style.visibility = "visible"; else tl.set(s, { visibility: "visible" }, t0);
  tl.set(s, { visibility: "hidden" }, t1);
  return s;
}
function place(node, x, y, scale = 1, extra = {}) { gsap.set(node, { xPercent: -50, yPercent: -50, left: 0, top: 0, x, y, scale, ...extra }); }

const THEMES = [
  { id: "01-minimal", name: "Modern Minimal", desc: "Calm sage, warm paper and timeless typography.", bar: "#f5f1e8", c: "#56684F" },
  { id: "02-romantic", name: "Warm & Romantic", desc: "Soft cream, muted rose and intimate photography.", bar: "#fff4eb", c: "#733747" },
  { id: "03-bold", name: "Modern & Bold", desc: "Deep teal, strong photography and editorial type.", bar: "#f1f3e9", c: "#133F3E" },
  { id: "04-terracotta", name: "Terracotta", desc: "Sun-baked clay, olive branches and linen.", bar: "#fbf6f0", c: "#A9502F" },
  { id: "05-heather", name: "Heather", desc: "Misty lilac, moorland heather and slate.", bar: "#faf8fb", c: "#655781" },
  { id: "06-coastal", name: "Coastal", desc: "Sea glass, driftwood and sea holly.", bar: "#f5f7f4", c: "#3F6C73" },
  { id: "07-riviera", name: "Riviera", desc: "Linen, Riviera blue stripes and lemons.", bar: "#fbf7ef", c: "#27468A" },
  { id: "08-alcantara", name: "Alcantara", desc: "Soft suede, cognac and deep espresso.", bar: "#f7f2ec", c: "#6F4330" },
  { id: "09-countryside", name: "Countryside", desc: "Oatmeal tweed, loden green and bracken.", bar: "#f6f1e6", c: "#3B4431" },
  { id: "10-velvet", name: "Velvet", desc: "Claret velvet, blush paper and gold ribbon.", bar: "#faf5f1", c: "#641F2A" },
  { id: "11-black-tie", name: "Black Tie", desc: "Black grosgrain, ivory letterpress and orchids.", bar: "#fbfaf7", c: "#161616" },
  { id: "12-evening-gold", name: "Evening Gold", desc: "Midnight navy, candlelight and champagne.", bar: "#1c2533", c: "#141B26", dark: true },
];
const TH = Object.fromEntries(THEMES.map((t) => [t.id, t]));

const STATUS_ICONS = `<span style="display:flex;gap:6px;align-items:center">
<svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
<svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0zM3.5 6.9a6.4 6.4 0 0 1 9 0l-1.4 1.4a4.4 4.4 0 0 0-6.2 0zM1.3 4.7a9.5 9.5 0 0 1 13.4 0l-1.4 1.4a7.5 7.5 0 0 0-10.6 0z" fill="currentColor"/></svg>
<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2.5" y="2.5" width="19" height="8" rx="2" fill="currentColor"/><rect x="25" y="4.5" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".5"/></svg></span>`;

function makePhone(parent) {
  const root = el("div", "phone", `<div class="screen"></div><div class="island"></div>
    <div class="side" style="left:-3px;top:170px;height:34px"></div><div class="side" style="left:-3px;top:230px;height:64px"></div>
    <div class="side" style="left:-3px;top:306px;height:64px"></div><div class="side" style="right:-3px;top:250px;height:100px"></div>`, parent);
  const screen = $(".screen", root);
  el("div", "glare", null, screen);
  return { root, screen };
}
function statusBar(parent, bar, dark) {
  return el("div", "status" + (dark ? " dark" : ""), `<span>9:41</span>${STATUS_ICONS}`, parent, `background:${bar}`);
}
function addShot(ph, themeId, page, opts = {}) {
  const t = TH[themeId];
  const layer = el("div", "layer", null);
  ph.screen.insertBefore(layer, $(".glare", ph.screen));
  statusBar(layer, t.bar, t.dark);
  const shot = el("div", "shot", null, layer);
  const img = el("img", null, null, shot);
  img.src = `assets/${themeId}-${page}${opts.full ? "-full" : ""}.jpg`;
  return { layer, img };
}
// Reveal a layer by wiping it up from the bottom.
function wipeIn(layer, t, dur = 0.5, ease = "expo.inOut") {
  gsap.set(layer, { clipPath: "inset(100% 0% 0% 0%)" });
  tl.to(layer, { clipPath: "inset(0% 0% 0% 0%)", duration: dur, ease }, t);
  const img = $("img", layer);
  if (img) tl.fromTo(img, { scale: 1.12, transformOrigin: "50% 0%" }, { scale: 1, duration: dur + 0.35, ease: "expo.out", immediateRender: false }, t);
}
function splitLines(node) { return new SplitText(node, { type: "lines", mask: "lines", linesClass: "ln" }); }
function splitChars(node) { return new SplitText(node, { type: "chars,lines", mask: "lines", linesClass: "ln" }); }

// Rolling number (odometer). Returns element with .roll(t, dur).
function odometer(parent, target, opts = {}) {
  const wrap = el("span", null, null, parent, "display:inline-flex;align-items:flex-start;overflow:hidden;vertical-align:top;line-height:1.08;height:1.08em");
  const cols = [];
  [...target].forEach((ch, i) => {
    if (!/\d/.test(ch)) { el("span", null, ch, wrap, "display:inline-block"); return; }
    const col = el("span", null, null, wrap, "display:inline-flex;flex-direction:column;line-height:1.08");
    const spins = (opts.spins ?? 10) + i * 2;
    const start = opts.from ? +opts.from[i] || 0 : (+ch + 3) % 10;
    const digits = [];
    for (let k = 0; k <= spins; k++) digits.push((start + k) % 10);
    // ensure final digit is the target
    const last = digits[digits.length - 1];
    const shift = (+ch - last + 10) % 10;
    for (let k = 1; k <= shift; k++) digits.push((last + k) % 10);
    digits.forEach((d) => el("span", null, String(d), col, "display:block;height:1.08em"));
    cols.push({ col, n: digits.length });
  });
  wrap.roll = (t, dur = 1.2, stagger = 0.08, e = "expo.out") => {
    cols.forEach(({ col, n }, i) => tl.fromTo(col, { yPercent: 0 }, { yPercent: -100 * (n - 1) / n, duration: dur, ease: e }, t + i * stagger));
  };
  return wrap;
}

/* ---------------- global overlays ---------------- */
const caption = el("div", null, "Example wedding · fictional names", stage);
caption.id = "caption";

/* =========================================================
   SCENE 1 — 0 to 5s — the date
   ========================================================= */
const s1 = scene("s1", 0, 5.4);
const glow = el("div", "abs", null, s1, "inset:0;background:radial-gradient(circle at 50% 52%,#15485c 0%,rgba(11,42,61,0) 58%)");
gsap.set(glow, { opacity: 0 });
tl.to(glow, { opacity: 1, duration: 2.5, ease: "sine.inOut" }, 0);

// Ring (shared with S2 and S9 styling)
const ringSvg = `<svg width="760" height="760" viewBox="0 0 760 760" style="position:absolute;left:0;top:0;overflow:visible">
<circle cx="380" cy="380" r="370" fill="none" stroke="#8fb1bd" stroke-opacity=".38" stroke-width="1.6" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" transform="rotate(-90 380 380)"/></svg>`;
const ring = el("div", "abs", ringSvg, stage, "width:760px;height:760px;z-index:3;pointer-events:none");
const ringC = $("circle", ring);
place(ring, 960, 540, 0.92);
tl.to(ringC, { attr: { "stroke-dashoffset": 0 }, duration: 2.0, ease: "power2.inOut" }, 1.55);

const s1ey = el("div", "abs eyebrow", "For your next chapter", s1, "left:0;width:1920px;top:318px;text-align:center;color:#a9c3cc");
gsap.set(s1ey, { opacity: 0, letterSpacing: "0.9em" });
tl.to(s1ey, { opacity: 1, letterSpacing: "0.42em", duration: 2.2, ease: "expo.out" }, 0.25);

const dateLine = el("div", "abs serif", null, s1, "left:0;width:1920px;top:392px;text-align:center;font-size:200px;letter-spacing:-.02em;color:#F4F0E6;white-space:nowrap");
const dWrap = el("span", null, null, dateLine, "display:inline-block");
const odoDay = odometer(dWrap, "12", { spins: 12 });
el("span", null, "<span style='display:inline-block;width:.42em;text-align:center;color:#8fb1bd;font-size:.55em;vertical-align:.4em'>·</span>", dWrap);
const odoMon = odometer(dWrap, "06", { spins: 14 });
el("span", null, "<span style='display:inline-block;width:.42em;text-align:center;color:#8fb1bd;font-size:.55em;vertical-align:.4em'>·</span>", dWrap);
const odoYr = odometer(dWrap, "2027", { spins: 16 });
gsap.set(dWrap, { opacity: 0 });
tl.to(dWrap, { opacity: 1, duration: 0.3, ease: "none" }, 0.5);
odoDay.roll(0.5, 1.5, 0.07);
odoMon.roll(0.62, 1.5, 0.07);
odoYr.roll(0.74, 1.6, 0.07);
cue("rollStart", 0.5);
cue("land", 2.1);
const s1line = el("div", "abs", null, s1, "left:660px;top:640px;width:600px;height:1.5px;background:#8fb1bd;opacity:.6;transform-origin:50% 50%");
gsap.set(s1line, { scaleX: 0 });
tl.to(s1line, { scaleX: 1, duration: 1.6, ease: "expo.inOut" }, 1.0);
const s1it = el("div", "abs corm", "<i>A beautiful beginning.</i>", s1, "left:0;width:1920px;top:690px;text-align:center;font-size:64px;color:#E9E4D6;font-weight:400");
const s1itS = splitChars(s1it);
gsap.set(s1itS.chars, { yPercent: 110 });
tl.to(s1itS.chars, { yPercent: 0, duration: 1.1, ease: "expo.out", stagger: 0.022 }, 1.95);

// exit S1
tl.to([odoDay, odoMon, odoYr].flatMap((o) => [...o.children]), { yPercent: -120, duration: 0.7, ease: "power3.in", stagger: 0.025 }, 3.85);
tl.to(dWrap, { opacity: 0, duration: 0.4, ease: "none" }, 4.25);
tl.to(s1itS.chars, { yPercent: -110, duration: 0.6, ease: "power3.in", stagger: 0.01 }, 3.95);
tl.to(s1ey, { opacity: 0, letterSpacing: "0.7em", duration: 0.7, ease: "power2.in" }, 3.9);
tl.to(s1line, { scaleX: 0, duration: 0.7, ease: "expo.in" }, 3.95);
// ring travels to hero position
tl.to(ring, { x: 1440, y: 575, scale: 0.86, duration: 1.3, ease: "swoop" }, 4.1);
cue("whoosh", 4.95, { len: 1.1 });

/* =========================================================
   SCENE 2 — 5 to 10s — homepage hero
   ========================================================= */
const s2 = scene("s2", 4.6, 10.4);
const s2ey = el("div", "abs eyebrow", "From Save the Date to final RSVP", s2, "left:180px;top:292px;color:#F4F0E6;font-size:16px");
const s2h = el("div", "abs serif", "Your wedding<br>website,<br><i style='color:#D8E0DA'>beautifully done.</i>", s2, "left:172px;top:338px;font-size:128px;line-height:1.02;letter-spacing:-.038em;color:#F7F4EC;white-space:nowrap");
const s2hS = splitLines(s2h);
gsap.set(s2hS.lines, { yPercent: 105 });
gsap.set(s2ey, { opacity: 0, x: -30 });
tl.to(s2ey, { opacity: 1, x: 0, duration: 0.9, ease: "expo.out" }, 5.1);
tl.to(s2hS.lines, { yPercent: 0, duration: 1.2, ease: "expo.out", stagger: 0.13 }, 5.15);
const s2meta = el("div", "abs", "No subscription<i></i>No app or login for guests<i></i>Twelve designs", s2, "left:180px;top:800px;font:400 21px/1 Arial;color:#cfdadf;display:flex;align-items:center;white-space:nowrap");
$$("i", s2meta).forEach((i) => i.style.cssText = "display:inline-block;width:1px;height:26px;background:#5e7a88;margin:0 26px");
gsap.set(s2meta, { opacity: 0, y: 20 });
tl.to(s2meta, { opacity: 1, y: 0, duration: 1, ease: "expo.out" }, 5.9);
const s2price = el("div", "abs", "Free to build and preview. £39 once when you’re ready to publish.", s2, "left:180px;top:860px;font:400 19px/1 Arial;color:#9fb3bd;white-space:nowrap");
gsap.set(s2price, { opacity: 0, y: 20 });
tl.to(s2price, { opacity: 1, y: 0, duration: 1, ease: "expo.out" }, 6.05);

// hero phones
const back = makePhone(stage); back.root.style.zIndex = 4;
addShot(back, "03-bold", "save-the-date");

  // S6 RSVP interactions (measured in page coordinates)
  const rpTop = (n) => { let y = 0; while (n && n !== rp) { y += n.offsetTop; n = n.offsetParent; } return y; };
  const rpLeft = (n) => { let x = 0; while (n && n !== rp) { x += n.offsetLeft; n = n.offsetParent; } return x; };
  const opt = (k) => $(`[data-k="${k}"]`, rp);
  const scrollTo = (n, t, dur = 0.42, at = 390) => tl.to(rp, { y: -(rpTop(n) - at), duration: dur, ease: "power2.inOut" }, t);
  const tapAt = (n, t, fx = 0.5) => {
    const x = rpLeft(n) + n.offsetWidth * fx, y = rpTop(n) + n.offsetHeight / 2;
    tl.set(tapDot, { left: x, top: y }, t - 0.01);
    tl.fromTo(tapDot, { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.5, duration: 0.45, ease: "power2.out", immediateRender: false }, t);
    cue("tap", t);
  };
  const select = (k, t) => {
    const o = opt(k);
    tapAt(o, t, 0.3);
    tl.to($(".sel", o), { opacity: 1, duration: 0.18, ease: "none" }, t + 0.03);
    const dot = $(".rad i", o);
    if (dot) tl.to(dot, { scale: 1, duration: 0.3, ease: "back.out(3)" }, t + 0.03);
    const chk = $(".chk i", o);
    if (chk) {
      tl.to(chk, { scale: 1, duration: 0.2, ease: "back.out(2)" }, t + 0.03);
      tl.to($(".chk path", o), { attr: { "stroke-dashoffset": 0 }, duration: 0.25, ease: "power2.out" }, t + 0.1);
    }
  };
  const tick = (i, t) => {
    tl.to(checks[i], { opacity: 1, x: 0, duration: 0.55, ease: "expo.out" }, t);
    tl.to($("path", checks[i]), { attr: { "stroke-dashoffset": 0 }, duration: 0.35, ease: "power2.out" }, t + 0.12);
  };
  scrollTo(nameInp, 28.05, 0.6, 330);
  const NAME = "Charlotte Reid", N0 = 28.6, N1 = 29.15;
  tapAt(nameInp, 28.5, 0.3);
  cue("type", N0, { end: N1 });
  updaters.push((t) => {
    const n = Math.round(prog(t, N0, N1) * NAME.length);
    const caret = t > 28.5 && t < 29.35 && (t < N1 || Math.floor(t * 4) % 2 === 0);
    nameInp.innerHTML = NAME.slice(0, n) + (caret ? '<span class="caret"></span>' : "");
  });
  select("accept", 29.35);
  tick(0, 29.4);
  scrollTo(opt("starter"), 29.7, 0.45, 330);
  select("starter", 30.2);
  scrollTo(opt("main"), 30.42, 0.4, 360);
  select("main", 30.85);
  scrollTo(opt("dessert"), 31.05, 0.4, 330);
  select("dessert", 31.45);
  tick(1, 31.5);
  scrollTo(opt("veg"), 31.65, 0.4, 470);
  select("veg", 32.05);
  tick(2, 32.1);
  const send = opt("send");
  tapAt(send, 32.45, 0.5);
  tl.to(send, { scale: 0.97, duration: 0.08, yoyo: true, repeat: 1 }, 32.45);
  tl.to(rp, { opacity: 0, y: "-=40", duration: 0.3, ease: "power2.in" }, 32.6);
  tl.to(thanks, { opacity: 1, y: -150, duration: 0.7, ease: "expo.out" }, 32.8);
  tick(3, 32.85);
  cue("ding", 32.85);

  // S6 -> S7
  tl.to(rsvpPh.root, { x: -520, rotation: -10, duration: 0.8, ease: "power3.in" }, 33.45);
  tl.to(s6right, { opacity: 0, x: 80, duration: 0.5, ease: "power2.in" }, 33.4);
  tl.to(s6, { backgroundColor: "#EAF2F6", duration: 0.5, ease: "none" }, 33.5);
  cue("whoosh", 33.9, { len: 0.7 });
  tl.to(s7ey, { opacity: 1, duration: 0.6, ease: "none" }, 33.7);
  tl.to(s7hS.lines, { yPercent: 0, duration: 1.0, ease: "expo.out" }, 33.72);
  [cardA, cardB, cardC].forEach((c, i) => tl.to(c, { opacity: 1, y: 0, z: 0, duration: 0.9, ease: "expo.out" }, 33.78 + i * 0.1));
  tl.to(cardD, { opacity: 1, y: 0, z: 0, duration: 0.9, ease: "expo.out" }, 34.15);
  tl.to(courseCards, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out", stagger: 0.09 }, 34.4);
  tl.to(dash, { rotationX: 7, rotationY: -4, z: 0, duration: 4.6, ease: "power2.out" }, 33.8);
  tl.to($(".barA", cardC), { scaleX: 1, duration: 1.1, ease: "expo.out" }, 34.5);
  tl.to($(".barB", cardC), { scaleX: 1, duration: 0.8, ease: "expo.out" }, 35.1);
  // reply chip flies in to the RSVP card
  const chip = el("div", "abs", `<b style="font-weight:700">Charlotte Reid</b> · Attending · Vegetarian`, stage, "left:0;top:0;z-index:12;background:#fff;border:1.5px solid #cfd8cf;border-radius:30px;padding:14px 24px;font:400 19px/1 Arial;color:#10283A;box-shadow:0 20px 40px -12px rgba(11,42,61,.35);white-space:nowrap");
  gsap.set(chip, { x: 420, y: 520, opacity: 0, scale: 0.7 });
  tl.to(chip, { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" }, 33.5);
  tl.to(chip, { x: 1330, y: 330, duration: 0.85, ease: "power3.inOut" }, 33.6);
  tl.to(chip, { scale: 0.4, opacity: 0, duration: 0.3, ease: "power2.in" }, 34.35);
  tl.set(chip, { visibility: "hidden" }, 34.7);
  cue("pop", 34.4);
  counters.forEach((c) => {
    const inCourse = c.n.closest(".cgrid");
    const idx = inCourse ? $$(".cnt", cardD).indexOf(c.n) : 0;
    c.t0 = inCourse ? 35.0 + idx * 0.07 : 34.55;
    c.t1 = c.t0 + (inCourse ? 0.8 : 1.3);
  });
  updaters.push((t) => counters.forEach((c) => { c.n.textContent = String(Math.round(prog(t, c.t0, c.t1, "power2.out") * c.to)); }));
  cue("count", 34.55, { end: 36.6 });

  // S7 exit is handled by the iris; S8 content
  tl.to(s8ey, { opacity: 1, letterSpacing: "0.34em", duration: 1.4, ease: "expo.out" }, 38.85);
  tl.to(pw, { opacity: 1, scale: 1, duration: 1.2, ease: "expo.out" }, 38.9);
  tl.to(pound, { yPercent: 0, duration: 0.8, ease: "expo.out" }, 38.9);
  pOdo.roll(38.95, 1.05, 0.12, "power4.out");
  cue("impact", 40.0);
  tl.to(once, { opacity: 1, x: 0, duration: 0.8, ease: "expo.out" }, 40.0);
  tl.to(pillEls, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.7)", stagger: 0.12 }, 40.25);
  pillEls.forEach((p, i) => cue("pill", 40.25 + i * 0.12));
  tl.to(s8line, { opacity: 1, duration: 0.7, ease: "none" }, 40.85);
  // exit S8
  tl.to([s8ey, pillEls, s8line], { opacity: 0, y: -30, duration: 0.45, ease: "power2.in", stagger: 0.02 }, 42.05);
  tl.to(pw, { opacity: 0, scale: 0.7, filter: "blur(10px)", duration: 0.5, ease: "power3.in" }, 42.1);
  cue("riser", 42.5, { from: 40.6 });

  // S9 end card
  tl.to(s9glow, { opacity: 1, duration: 2, ease: "sine.inOut" }, 42.5);
  tl.to(ring2C, { attr: { "stroke-dashoffset": 0 }, duration: 1.8, ease: "power2.inOut" }, 42.55);
  tl.fromTo(ring2, { rotation: -40 }, { rotation: 0, duration: 5, ease: "power2.out", immediateRender: false }, 42.5);
  tl.to(markS.chars, { yPercent: 0, opacity: 1, duration: 1.1, ease: "expo.out", stagger: 0.035 }, 42.62);
  cue("finale", 42.5);
  dots.forEach((d, i) => tl.to(d, { scale: 1, duration: 0.5, ease: "back.out(3)" }, 43.0 + i * 0.07));
  tl.to(tag, { opacity: 1, letterSpacing: "0.42em", duration: 1.8, ease: "expo.out" }, 43.3);
  tl.to(cta, { opacity: 1, y: 0, duration: 0.9, ease: "expo.out" }, 43.85);
  tl.to(url, { opacity: 1, y: 0, duration: 0.9, ease: "expo.out" }, 44.05);
  tl.to(ring2, { scale: 1.3, duration: 3.5, ease: "sine.inOut" }, 44.0);

  // caption for the example wedding
  tl.to(caption, { opacity: 0.55, duration: 0.5 }, 5.6);
  tl.to(caption, { opacity: 0, duration: 0.4 }, 38.4);

  tl.seek(0, true);
}

/* ---------------- film grain ---------------- */
const grain = el("canvas", null, null, stage); grain.id = "grain"; grain.width = 960; grain.height = 540;
el("div", null, null, stage).id = "vig";
const gctx = grain.getContext("2d");
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const noiseFrames = Array.from({ length: 8 }, () => {
  const img = gctx.createImageData(960, 540);
  for (let i = 0; i < img.data.length; i += 4) { const v = rnd() * 255 | 0; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  return img;
});

// Cues and duration are exported in real (playback) seconds.
const real = (x) => +(x / SPEED).toFixed(4);
window.__cues = cues.map((c) => ({ ...c, t: real(c.t), ...(c.end != null && { end: real(c.end) }), ...(c.from != null && { from: real(c.from) }), ...(c.len != null && { len: real(c.len) }) }));
window.__speed = SPEED;
window.__duration = DURATION / SPEED;
window.__seek = (rt, frame) => {
  const t = rt * SPEED;
  tl.seek(Math.max(0, t), false);
  for (const u of updaters) u(t);
  gctx.putImageData(noiseFrames[(frame ?? Math.round(rt * 60)) % noiseFrames.length], 0, 0);
  return new Promise((res) => requestAnimationFrame(() => requestAnimationFrame(res)));
};
await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
finalize();
cues.sort((a, b) => a.t - b.t);
await window.__seek(0);
window.__ready = true;
})();
</script>
