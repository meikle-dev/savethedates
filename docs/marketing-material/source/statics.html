<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>SaveTheDates static images</title>
<style>
@font-face{font-family:"Cormorant";src:url(assets/cormorant-garamond-latin-regular.woff2) format("woff2");font-style:normal;font-weight:300 700}
@font-face{font-family:"Cormorant";src:url(assets/cormorant-garamond-latin-italic.woff2) format("woff2");font-style:italic;font-weight:300 700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0B2A3D;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden}
#base{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
.t{position:absolute}
.serif{font-family:Georgia,"Times New Roman",serif;font-weight:400}
.corm{font-family:"Cormorant",Georgia,serif}
.eyebrow{font:700 17px/1.2 Arial,sans-serif;letter-spacing:.32em;text-transform:uppercase}
.phone{position:absolute;width:418px;height:918px;border-radius:68px;
  background:linear-gradient(150deg,#3a4852 0%,#141d24 22%,#0c1318 60%,#27343d 100%);
  box-shadow:inset 0 0 0 1.5px #6b7b86,inset 0 0 0 5px #10181e,0 60px 120px -30px rgba(0,0,0,.55),0 24px 50px -16px rgba(0,0,0,.4)}
.phone .screen{position:absolute;left:14px;top:14px;width:390px;height:890px;border-radius:54px;overflow:hidden;background:#fff}
.phone .island{position:absolute;left:50%;top:27px;width:116px;height:33px;margin-left:-58px;border-radius:20px;background:#04070a;z-index:5}
.phone .glare{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 70%,rgba(255,255,255,.05) 100%);z-index:4}
.phone .side{position:absolute;width:4px;border-radius:2px;background:#2a353d}
.status{position:absolute;left:0;top:0;width:390px;height:46px;display:flex;justify-content:space-between;align-items:center;padding:4px 36px 0 44px;font:700 16px/1 "Segoe UI",Arial,sans-serif;color:#15191c;z-index:2}
.status.dark{color:#f3efe6}
.shot{position:absolute;left:0;top:46px;width:390px;height:844px;overflow:hidden}
.shot img{position:absolute;left:0;top:0;width:390px;display:block}
.mini{position:absolute;width:210px;height:458px;border-radius:34px;background:#0e161c;box-shadow:inset 0 0 0 1.5px #56646e,0 30px 60px -20px rgba(0,0,0,.6);padding:7px}
.mini .in{width:100%;height:100%;border-radius:28px;overflow:hidden;position:relative}
.mini .in i{position:absolute;left:0;top:0;right:0;height:22px}
.mini img{position:absolute;left:0;top:22px;width:196px}
.shotcard{position:absolute;border-radius:22px;overflow:hidden;box-shadow:0 40px 80px -24px rgba(11,42,61,.45),0 0 0 1px rgba(11,42,61,.08);background:#fff}
.shotcard img{display:block;width:100%}
.btn{display:inline-flex;align-items:center;gap:22px;background:#F4F0E6;border-radius:8px;padding:0 12px 0 32px;height:78px;font:700 25px/1 Arial;color:#0B2A3D;white-space:nowrap}
.btn span{width:54px;height:54px;border-radius:6px;background:#0F4C5C;display:flex;align-items:center;justify-content:center}
.check{display:flex;align-items:flex-start;gap:18px}
.check b{flex:0 0 auto;font-weight:400}
.strike{position:relative;display:inline-block}
.strike:after{content:"";position:absolute;left:-6px;right:-6px;top:55%;height:4px;background:#E0A58F}
</style>
</head>
<body>
<div id="stage"><div id="base"></div></div>
<script>
"use strict";
const NAVY = "#0B2A3D", PAPER = "#F8F6F0", CREAM = "#F7F4EC", MIST = "#D8E0DA", TEAL = "#0F4C5C", SAGE = "#2F6B4F";
const KIND = { P45: [1080, 1350], P916: [1080, 1920], P23: [1000, 1500], SQ: [1080, 1080], LS: [1200, 628], YT: [1280, 720], COVER: [1640, 924], LOGO: [1200, 300] };
const TH = {
  "01-minimal": { name: "Modern Minimal", desc: "Calm sage, warm paper and timeless typography.", bar: "#f5f1e8", c: "#56684F" },
  "02-romantic": { name: "Warm & Romantic", desc: "Soft cream, muted rose and intimate photography.", bar: "#fff4eb", c: "#733747" },
  "03-bold": { name: "Modern & Bold", desc: "Deep teal, strong photography and editorial type.", bar: "#f1f3e9", c: "#133F3E" },
  "04-terracotta": { name: "Terracotta", desc: "Sun-baked clay, olive branches and linen.", bar: "#fbf6f0", c: "#A9502F" },
  "05-heather": { name: "Heather", desc: "Misty lilac, moorland heather and slate.", bar: "#faf8fb", c: "#655781" },
  "06-coastal": { name: "Coastal", desc: "Sea glass, driftwood and sea holly.", bar: "#f5f7f4", c: "#3F6C73" },
  "07-riviera": { name: "Riviera", desc: "Linen, Riviera blue stripes and lemons.", bar: "#fbf7ef", c: "#27468A" },
  "08-alcantara": { name: "Alcantara", desc: "Soft suede, cognac and deep espresso.", bar: "#f7f2ec", c: "#6F4330" },
  "09-countryside": { name: "Countryside", desc: "Oatmeal tweed, loden green and bracken.", bar: "#f6f1e6", c: "#3B4431" },
  "10-velvet": { name: "Velvet", desc: "Claret velvet, blush paper and gold ribbon.", bar: "#faf5f1", c: "#641F2A" },
  "11-black-tie": { name: "Black Tie", desc: "Black grosgrain, ivory letterpress and orchids.", bar: "#fbfaf7", c: "#161616" },
  "12-evening-gold": { name: "Evening Gold", desc: "Midnight navy, candlelight and champagne.", bar: "#1c2533", c: "#141B26", dark: true },
};
const IDS = Object.keys(TH);
const A = (f) => `assets/${f}`;
const STATUS_ICONS = `<span style="display:flex;gap:6px;align-items:center"><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2.5" y="2.5" width="19" height="8" rx="2" fill="currentColor"/></svg></span>`;
const ARROW = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M6 18 18 6M8 6h10v10"/></svg>`;

function el(tag, cls, html, parent, css) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  if (css) e.style.cssText = css;
  if (parent) parent.appendChild(e);
  return e;
}
const shotOf = (id, page, full) => ({ src: A(`${id}-${page}${full ? "-full" : ""}.jpg`), bar: TH[id].bar, dark: TH[id].dark });
function phone(p, o) {
  const root = el("div", "phone", `<div class="screen"><div class="status${o.dark ? " dark" : ""}" style="background:${o.bar}"><span>9:41</span>${STATUS_ICONS}</div><div class="shot"><img src="${o.src}" style="top:${-(o.scroll || 0)}px"></div><div class="glare"></div></div><div class="island"></div><div class="side" style="left:-3px;top:170px;height:34px"></div><div class="side" style="left:-3px;top:230px;height:64px"></div><div class="side" style="right:-3px;top:250px;height:100px"></div>`, p,
    `left:${o.x - 209}px;top:${o.y - 459}px;transform:rotate(${o.r || 0}deg) scale(${o.s});z-index:${o.z || 2}`);
  return root;
}
function ring(p, cx, cy, r, color = "#8fb1bd", op = 0.4, dots = false) {
  const g = el("div", "t", `<svg width="${2 * r + 40}" height="${2 * r + 40}" style="overflow:visible"><circle cx="${r + 20}" cy="${r + 20}" r="${r}" fill="none" stroke="${color}" stroke-opacity="${op}" stroke-width="1.6"/></svg>`, p, `left:${cx - r - 20}px;top:${cy - r - 20}px;z-index:1`);
  if (dots) IDS.forEach((id, i) => {
    const a = (-90 + i * 30) * Math.PI / 180, d = Math.max(12, r * 0.05);
    el("div", "t", null, g, `left:${r + 20 + r * Math.cos(a) - d / 2}px;top:${r + 20 + r * Math.sin(a) - d / 2}px;width:${d}px;height:${d}px;border-radius:50%;background:${TH[id].c};box-shadow:0 0 0 1.5px rgba(244,240,230,.6)`);
  });
  return g;
}
function glow(p, x, y, color = "#15485c", size = 60) {
  el("div", "t", null, p, `inset:0;background:radial-gradient(circle at ${x}% ${y}%,${color} 0%,rgba(11,42,61,0) ${size}%)`);
}
function vignette(p, strength = 0.22) {
  el("div", "t", null, p, `inset:0;z-index:40;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 60%,rgba(0,0,0,${strength}) 100%)`);
}
function shotcard(p, src, x, y, w, rot = 0, z = 5) {
  return el("div", "shotcard", `<img src="${src}">`, p, `left:${x}px;top:${y}px;width:${w}px;transform:rotate(${rot}deg);z-index:${z}`);
}

/* ---------------- generic frame ----------------
   Portrait kinds: text on top, visual in the middle, footer at the bottom.
   Square and landscape: text on the left, visual on the right. */
const PORTRAIT = (k) => k === "P45" || k === "P916" || k === "P23";
const SIZES = {
  P45: { top: 84, head: 82, sub: 25, eb: 16, side: 70 },
  P23: { top: 96, head: 80, sub: 25, eb: 16, side: 64 },
  P916: { top: 262, head: 92, sub: 28, eb: 18, side: 76 },
  SQ: { head: 64, sub: 22, eb: 14, side: 72 },
  LS: { head: 50, sub: 19, eb: 12, side: 52 },
  YT: { head: 60, sub: 22, eb: 14, side: 70 },
};
function footer(base, kind, dark, example) {
  const [W, H] = KIND[kind];
  const ink = dark ? CREAM : NAVY, soft = dark ? "rgba(244,240,230,.7)" : "rgba(11,42,61,.72)";
  const row = { P45: H - 96, P23: H - 104, P916: 1508, SQ: H - 84, LS: H - 50, YT: H - 60 }[kind];
  const big = { LS: 26, YT: 30 }[kind] || 36, small = { LS: 16, YT: 18 }[kind] || 21, side = SIZES[kind].side;
  el("div", "t serif", "SaveTheDates", base, `left:${side}px;top:${row}px;font-size:${big}px;letter-spacing:-.04em;color:${ink};z-index:30`);
  el("div", "t", "savethedates.co.uk", base, `right:${side}px;top:${row + big * 0.28}px;font-size:${small}px;color:${soft};z-index:30`);
  if (example) {
    const y = { P45: H - 34, P23: H - 38, P916: 1576, SQ: H - 30, LS: H - 18, YT: H - 22 }[kind];
    el("div", "t", "Example wedding · fictional names", base, `left:0;width:${W}px;top:${y}px;text-align:center;font:700 ${kind === "LS" ? 9 : 11}px/1 Arial;letter-spacing:.22em;text-transform:uppercase;color:${soft};opacity:.75;z-index:30`);
  }
  return row;
}
function textBlock(base, o, kind, align) {
  const S = SIZES[kind], ink = o.dark ? CREAM : NAVY, accent = o.dark ? MIST : (o.accent || TEAL);
  const b = el("div", "t", null, base, `left:${o.tx ?? S.side}px;width:${o.tw ?? KIND[kind][0] - 2 * S.side}px;text-align:${align};z-index:20`);
  if (o.eyebrow) el("div", "eyebrow", o.eyebrow, b, `font-size:${S.eb}px;color:${o.dark ? "#a9c3cc" : (o.accent || SAGE)};margin-bottom:${S.eb * 1.3}px`);
  if (o.head) el("div", "serif", o.head.replace(/<i>/g, `<i style="color:${accent}">`), b, `font-size:${(o.headScale || 1) * S.head}px;line-height:1.05;letter-spacing:-.035em;color:${ink}`);
  if (o.italic) el("div", "corm", `<i>${o.italic}</i>`, b, `font-size:${S.head * 0.56}px;line-height:1.25;color:${o.dark ? "rgba(244,240,230,.88)" : "rgba(11,42,61,.85)"};margin-top:${S.head * 0.18}px`);
  if (o.sub) el("div", null, o.sub, b, `font:400 ${S.sub}px/1.45 Arial;color:${o.dark ? "rgba(244,240,230,.82)" : "rgba(16,40,58,.82)"};margin-top:${S.sub * 0.8}px`);
  return b;
}
function frame(kind, o) {
  const base = setup(kind, o.bg || NAVY);
  const [W, H] = KIND[kind];
  if (o.backdrop) o.backdrop(base, kind);
  const fTop = o.footer === false ? H : footer(base, kind, o.dark, o.example);
  if (PORTRAIT(kind)) {
    const S = SIZES[kind];
    const tb = textBlock(base, o, kind, "center");
    tb.style.top = S.top + "px";
    const y0 = S.top + tb.offsetHeight + (o.gap ?? 44);
    if (o.visual) o.visual(base, { x: 0, y: y0, w: W, h: fTop - 36 - y0 }, kind);
  } else {
    const S = SIZES[kind];
    const tw = Math.round(W * (kind === "SQ" ? 0.45 : 0.44));
    const tb = textBlock(base, { ...o, tw }, kind, "left");
    const avail = fTop - 20;
    tb.style.top = Math.max(30, (avail - tb.offsetHeight) / 2) + "px";
    const x0 = S.side + tw + 16;
    if (o.visual) o.visual(base, { x: x0, y: 16, w: W - x0 - 10, h: fTop - 26 }, kind);
  }
  vignette(base, o.dark ? 0.24 : 0.1);
  return base;
}
function setup(kind, bg) {
  const [W, H] = KIND[kind];
  const base = document.getElementById("base");
  base.innerHTML = "";
  base.style.width = W + "px"; base.style.height = H + "px"; base.style.background = bg;
  return base;
}

/* ---------------- visuals ---------------- */
function vHero(base, b) {
  const s = Math.min(b.h * 0.93 / 918, b.w * 0.86 / (418 * 1.85));
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  ring(base, cx + 418 * s * 0.05, cy, 918 * s * 0.55);
  phone(base, { ...shotOf("03-bold", "save-the-date"), x: cx - 418 * s * 0.4, y: cy + 918 * s * 0.035, s: s * 0.88, r: -9, z: 3 });
  phone(base, { ...shotOf("01-minimal", "save-the-date"), x: cx + 418 * s * 0.42, y: cy, s, r: 6, z: 4 });
}
function vOne(id, page, opt = {}) {
  return (base, b) => {
    const s = Math.min(b.h * 0.97 / 918, b.w * 0.8 / 418) * (opt.scale || 1);
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    if (opt.ring) ring(base, cx, cy, 918 * s * 0.56, opt.ringColor || "#ffffff", 0.3);
    const src = opt.src ? { src: A(opt.src), bar: opt.bar || "#f5f1e8" } : shotOf(id, page, opt.full);
    phone(base, { ...src, x: cx, y: cy, s, r: opt.rot || 0, scroll: opt.scroll, z: 4 });
  };
}
function vRsvp(base, b, kind) {
  const wide = b.w / b.h > 1.05;
  const s = Math.min(b.h * 0.9 / 918, b.w * (wide ? 0.42 : 0.5) / 418);
  const px = b.x + (wide ? b.w * 0.26 : b.w * 0.33), cy = b.y + b.h / 2;
  phone(base, { src: A("journey-rsvp-filled.jpg"), bar: "#fffdf7", x: px, y: cy, s, r: -3, z: 4 });
  const cw = Math.min(b.w * (wide ? 0.66 : 0.6), (b.h * 0.6) * 1400 / 968);
  shotcard(base, A("crop-guests-catering-numbers.jpg"), b.x + b.w - cw - b.w * 0.03, cy - (cw * 968 / 1400) * 0.28, cw, 2, 6);
}
function vShare(base, b) {
  const cw = Math.min(b.w * 0.82, b.h * 0.62 * 1400 / 848);
  const ch = cw * 848 / 1400;
  const s = Math.min(b.h * 0.8 / 918, b.w * 0.36 / 418);
  const top = b.y + (b.h - Math.max(ch, 918 * s)) / 2;
  shotcard(base, A("crop-share-save-the-date-panel.jpg"), b.x + b.w * 0.06, top + b.h * 0.02, cw, -2, 5);
  phone(base, { ...shotOf("01-minimal", "save-the-date"), x: b.x + b.w * 0.8, y: b.y + b.h * 0.6, s, r: 5, z: 6 });
}
function vPages(themeId, labels = true, dark = false) {
  return (base, b) => {
    const pages = [["save-the-date", "Save the Date"], ["invitation", "Invitation"], ["details", "Details"], ["rsvp", "RSVP"]];
    const lab = labels ? Math.max(44, b.h * 0.09) : 0;
    const s = Math.min((b.h - lab) * 0.95 / 918, b.w * 0.96 / (4 * 418 * 1.04));
    const step = 418 * s * 1.04, x0 = b.x + b.w / 2 - 1.5 * step, cy = b.y + (b.h - lab) / 2;
    pages.forEach(([p, name], i) => {
      phone(base, { ...shotOf(themeId, p, p === "details"), x: x0 + i * step, y: cy + (i % 2 ? 918 * s * 0.03 : 0), s, z: 4, scroll: p === "details" ? 260 : 0 });
      if (labels) el("div", "t serif", name, base, `left:${x0 + i * step - step / 2}px;width:${step}px;top:${cy + 459 * s + lab * 0.25}px;text-align:center;font-size:${Math.max(16, lab * 0.42)}px;color:${dark ? CREAM : NAVY};z-index:5`);
    });
  };
}
function wall(base, kind, o = {}) {
  const [W, H] = KIND[kind];
  const wrap = el("div", "t", null, base, `inset:0;perspective:2600px;overflow:hidden;z-index:0`);
  const wl = el("div", "t", null, wrap, `left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;transform:rotateX(28deg) rotateZ(-17deg) scale(${o.scale || Math.max(W, H) / 1500})`);
  const pages = ["save-the-date", "invitation", "rsvp", "details"];
  const COLS = 11, ROWS = 7, CW = 246, RH = 494;
  for (let c = 0; c < COLS; c++) {
    const col = el("div", "t", null, wl, `left:${(c - (COLS - 1) / 2) * CW - 105}px;top:${-(ROWS / 2) * RH + (c % 2 ? 120 : -60)}px;width:210px;height:${ROWS * RH}px`);
    for (let r = 0; r < ROWS; r++) {
      const id = IDS[(c * 5 + r * 7) % 12], pg = pages[(c + r * 3) % 4];
      el("div", "mini", `<div class="in" style="background:${TH[id].bar}"><i style="background:${TH[id].bar}"></i><img src="${A(`${id}-${pg}-sm.jpg`)}"></div>`, col, `left:0;top:${r * RH}px`);
    }
  }
  if (o.shade !== false) el("div", "t", null, base, `inset:0;z-index:1;background:radial-gradient(ellipse ${o.shadeW || 62}% ${o.shadeH || 44}% at 50% ${o.shadeY || 50}%,rgba(11,42,61,.94) 0%,rgba(11,42,61,.74) 50%,rgba(11,42,61,.12) 100%)`);
}

/* ---------------- templates ---------------- */
const T = {};
T.hero = (kind) => frame(kind, {
  dark: true, example: true, eyebrow: "From Save the Date to final RSVP",
  head: kind === "LS" || kind === "SQ" || kind === "YT" ? "Your wedding website, <i>beautifully done.</i>" : "Your wedding website,<br><i>beautifully done.</i>",
  sub: PORTRAIT(kind) ? "Save the Date, invitation, details and RSVPs with meal choices, on one private wedding website." : "Free to build and preview. £39 once when you’re ready to publish.",
  backdrop: (b) => glow(b, PORTRAIT(kind) ? 50 : 72, PORTRAIT(kind) ? 64 : 50), visual: vHero,
});
T.designs = (kind) => {
  const [W, H] = KIND[kind];
  const base = setup(kind, NAVY);
  wall(base, kind, { shadeW: PORTRAIT(kind) ? 80 : 60, shadeH: PORTRAIT(kind) ? 30 : 52 });
  const S = SIZES[kind];
  const b = el("div", "t", null, base, `left:0;width:${W}px;text-align:center;z-index:20`);
  el("div", "eyebrow", "Each with a matching Save the Date, Invitation, Details and RSVP", b, `font-size:${S.eb * (kind === "LS" ? 0.9 : 0.85)}px;color:#a9c3cc;margin-bottom:${S.eb * 1.6}px;letter-spacing:.24em;white-space:normal;padding:0 ${S.side}px`);
  el("div", "serif", "Twelve designs.", b, `font-size:${S.head * 1.5}px;line-height:1;letter-spacing:-.04em;color:${CREAM}`);
  el("div", "corm", "<i>Find your kind of beautiful.</i>", b, `font-size:${S.head * 0.7}px;color:${MIST};margin-top:${S.head * 0.2}px`);
  b.style.top = (H - b.offsetHeight) / 2 - (PORTRAIT(kind) ? H * 0.02 : 10) + "px";
  el("div", "t", null, base, `left:0;right:0;bottom:0;height:${PORTRAIT(kind) ? 26 : 30}%;z-index:2;background:linear-gradient(to top,rgba(11,42,61,.96) 0%,rgba(11,42,61,.8) 45%,rgba(11,42,61,0) 100%)`);
  footer(base, kind, true, true);
  vignette(base, 0.3);
};
T.rsvp = (kind) => frame(kind, {
  bg: PAPER, eyebrow: "Online RSVP with meal choices", accent: SAGE, example: true,
  head: PORTRAIT(kind) ? "RSVPs without the<br><i>spreadsheet chaos.</i>" : "RSVPs without the <i>spreadsheet chaos.</i>",
  sub: PORTRAIT(kind) ? "Guests choose their starter, main and dessert and tell you about dietary requirements. Meal numbers ready to send to your caterer." : "Starter, main, dessert and dietary needs with every reply. Meal numbers ready for your caterer.",
  visual: vRsvp,
});
T.share = (kind) => frame(kind, {
  dark: true, example: true, eyebrow: "Send each by WhatsApp, text or email",
  head: "Simple to share.<br><i>Private to you.</i>",
  sub: "Each link comes with a ready-written message. No envelopes, stamps or postal addresses.",
  backdrop: (b) => glow(b, 60, 70), visual: vShare,
});
T.envelopes = (kind) => frame(kind, {
  dark: true, example: true,
  head: `<span class="strike">Envelopes.</span><br><span class="strike">Stamps.</span><br><span class="strike">Postal addresses.</span><br><i>Just a link.</i>`,
