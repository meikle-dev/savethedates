name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:start
      - run: npm run local:env -- --force
      - run: npm run test:integration
      - run: npm run test:persistence
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker compose up --build -d --wait
      - name: Development container smoke
        run: |
          curl --retry 20 --retry-connrefused --retry-delay 2 --fail http://127.0.0.1:3000/demo > /tmp/demo.html
          node scripts/smoke-development.mjs
          docker compose exec -T app node -e "fetch('http://127.0.0.1:3000/account/sign-up').then(r => { if (r.status !== 200) process.exit(1); console.log('Application-container connectivity passed') })"
      - name: Browser checks through development container
        run: E2E_BASE_URL=http://127.0.0.1:3000 npm run test:e2e
      - run: docker compose down
        if: always()
      - run: docker build --target production -t save-the-dates:ci .
      - name: Production container smoke
        run: |
          docker run -d --name wedding-smoke --add-host host.docker.internal:host-gateway --env-file .env.docker -p 127.0.0.1:3000:3000 save-the-dates:ci
          curl --retry 20 --retry-connrefused --retry-delay 2 --fail http://127.0.0.1:3000 > /dev/null
          npm run smoke
          E2E_BASE_URL=http://127.0.0.1:3000 E2E_PRODUCTION=1 npx playwright test tests/publication.spec.ts
      - run: docker rm -f wedding-smoke
        if: always()
      - run: npm run db:stop
        if: always()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
